<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Good Nas | Profil Peribadi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 50px 20px; 
        }
        .profil-kad { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0px 10px 20px rgba(0,0,0,0.05); 
            max-width: 450px; 
            margin: auto; 
        }
        img.avatar { 
            border-radius: 50%; 
            width: 150px; 
            height: 150px; 
            object-fit: cover; 
            border: 3px solid #333;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .username { color: #7f8c8d; font-weight: bold; margin-top: 0; }
        p { color: #555; line-height: 1.6; margin-bottom: 25px; }
        .butang { 
            display: inline-block; 
            padding: 12px 25px; 
            background: #ee4d2d; /* Warna tema Shopee */
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: 0.3s;
        }
        .butang:hover { background: #d73a1e; }
    </style>
</head>
<body>

    <div class="profil-kad">
        <!-- Gantikan dengan gambar profil sebenar awak -->
        <img src="gambar-nasrin.jpg" alt="Nasrin Nordin" class="avatar">
        
        <h1>Nasrin Nordin</h1>
        <p class="username">@thegoodnas</p>
        
        <p>Pengasas Runchick Farm & Peminat Teknologi dari Johor Bahru. Memfokuskan kepada penternakan ayam berkualiti dan pengarkiban media digital.</p>
        
        <a href="https://shopee.com.my/nasrinnordinofficialstore" target="_blank" class="butang">Lawati Nasrin Nordin Official Store</a>
    </div>

</body>
</html>
